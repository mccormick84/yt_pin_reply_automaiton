name: YouTube 새 영상 감지

on:
  schedule:
    - cron: "0 9 * * *"     # 18:00 KST
    - cron: "30 9 * * *"    # 18:30 KST
    - cron: "0 10 * * *"    # 19:00 KST
    - cron: "30 10 * * *"   # 19:30 KST
    - cron: "0 11 * * *"    # 20:00 KST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 설정 파일 복원
        run: |
          echo '${{ secrets.MONITOR_CONFIG }}' | base64 -d > monitor_config.json

      - name: 새 영상 감지 및 노션/이메일 알림
        env:
          LAST_VIDEO_ID: ${{ secrets.LAST_VIDEO_ID }}
        run: python yt_monitor.py

      - name: LAST_VIDEO_ID 업데이트
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f last_video_id.txt ]; then
            gh secret set LAST_VIDEO_ID --body "$(cat last_video_id.txt)" --repo ${{ github.repository }}
            echo "LAST_VIDEO_ID 업데이트 완료"
          fi
